<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Ladders AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#020617;
  --card:#0f172a;
  --primary:#38bdf8;
  --accent:#22c55e;
  --text:#fff;
  --muted:#94a3b8;
}

body {
  margin:0;
  font-family:Poppins;
  background:var(--bg);
  color:var(--text);
}

/* HERO */
.hero {
  padding:60px 5%;
  text-align:center;
}

.brand {
  font-size:2.5rem;
  font-weight:700;
}

.tagline {
  color:var(--muted);
  margin:20px 0;
}

.btn {
  padding:12px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.primary { background:var(--primary); }
.secondary {
  background:transparent;
  border:1px solid var(--primary);
  color:var(--primary);
}

/* SECTION */
.section {
  padding:50px 5%;
}

.card {
  background:var(--card);
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

/* LOCK */
.lock-overlay {
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(6px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border-radius:10px;
}

input, select {
  width:100%;
  padding:10px;
  margin:10px 0;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1 class="brand">DREAM LADDERS AI</h1>
  <p class="tagline">AI-Powered Civil Engineering Estimation</p>

  <button class="btn primary" onclick="scrollToEstimator()">
    Start Estimation
  </button>
</section>

<!-- DEMO -->
<section class="section">
  <h2>Real Project Accuracy</h2>

  <div class="card">
    <p>Steel: 7447 kg vs 7450 kg</p>
    <p>Cement: 820 vs 835</p>
    <p>Cost: ₹27.5L vs ₹28L</p>
  </div>
</section>

<!-- ESTIMATOR -->
<section id="estimator" class="section">

  <h2>AI Construction Estimator</h2>

  <div class="card">

    <input type="number" id="area" placeholder="Area sqft">
    <input type="number" id="floors" placeholder="Floors">

    <select id="quality">
      <option value="1500">Standard</option>
      <option value="1800">Premium</option>
      <option value="2200">Luxury</option>
    </select>

    <button class="btn primary" onclick="estimateCost()">Estimate</button>

    <div id="result"></div>

    <!-- LOCKED REPORT -->
    <div id="locked" style="display:none; position:relative; margin-top:20px;" class="card">

      <div class="lock-overlay">
        <p>🔒 Detailed Report Locked</p>
        <button class="btn primary" onclick="unlock()">Unlock ₹499</button>
      </div>

      <div>
        <p>Steel: XXXX kg</p>
        <p>Cement: XXXX bags</p>
        <p>Foundation Cost: ₹X</p>
      </div>

    </div>

  </div>

</section>

<script>

function scrollToEstimator() {
  document.getElementById("estimator").scrollIntoView({behavior:"smooth"});
}

function estimateCost() {
  let area = document.getElementById("area").value;
  let floors = document.getElementById("floors").value;
  let rate = document.getElementById("quality").value;

  let cost = area * floors * rate;

  document.getElementById("result").innerHTML =
    "<h3>₹ " + cost.toLocaleString() + "</h3>";

  document.getElementById("locked").style.display = "block";
}

function unlock() {
  window.open("https://wa.me/917093218658?text=I want report ₹499");
}

</script>

</body>
</html>
