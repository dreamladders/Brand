<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Ladders</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ===== BASE (MOBILE FIRST) ===== */
:root {
  --bg: #020617;
  --card: #0f172a;
  --primary: #38bdf8;
  --accent: #22c55e;
  --text: #ffffff;
  --muted: #94a3b8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

/* ===== NAVBAR ===== */
.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 5%;
}

.logo {
  font-weight: 700;
  font-size: 1.2rem;
}

.menu {
  display: none;
  flex-direction: column;
  gap: 1rem;
}

.menu a {
  color: var(--text);
  text-decoration: none;
}

.hamburger {
  font-size: 1.5rem;
  cursor: pointer;
}

/* ===== HERO ===== */
.hero {
  padding: 3rem 5%;
  display: flex;
  flex-direction: column;
  gap: 2rem;
  text-align: center;
}

.brand {
  font-size: 2rem;
  font-weight: 700;
}

.tagline {
  font-size: 1rem;
  color: var(--muted);
}

.highlight {
  color: var(--primary);
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.btn {
  padding: 0.9rem;
  border-radius: 8px;
  border: none;
  font-size: 1rem;
  cursor: pointer;
}

.primary {
  background: var(--primary);
  color: black;
}

.secondary {
  border: 1px solid var(--primary);
  color: var(--primary);
  background: transparent;
}

/* ===== IMAGE ===== */
.hero-img {
  width: 180px;
  margin: auto;
}

/* ===== DEMO ===== */
.demo {
  padding: 3rem 5%;
}

.card {
  background: var(--card);
  padding: 1.5rem;
  border-radius: 10px;
  margin-top: 1.5rem;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 1rem;
  font-size: 0.8rem;
}

th, td {
  padding: 0.5rem;
  text-align: center;
}

th {
  background: #1e293b;
}

/* ===== CTA ===== */
.cta {
  margin-top: 2rem;
  text-align: center;
}

.cta .buttons {
  margin-top: 1rem;
}

/* ===== TABLET (768px) ===== */
@media (min-width: 768px) {

  .hero {
    flex-direction: row;
    text-align: left;
    align-items: center;
  }

  .hero-left {
    flex: 1;
  }

  .hero-right {
    flex: 1;
    text-align: center;
  }

  .buttons {
    flex-direction: row;
  }

  table {
    font-size: 0.9rem;
  }

}

/* ===== DESKTOP (1024px+) ===== */
@media (min-width: 1024px) {

  .menu {
    display: flex;
    flex-direction: row;
  }

  .hamburger {
    display: none;
  }

  .brand {
    font-size: 3rem;
  }

  .tagline {
    font-size: 1.2rem;
  }

  .hero {
    padding: 5rem 10%;
  }

  .demo {
    padding: 5rem 10%;
  }

}

/* ===== LARGE SCREENS ===== */
@media (min-width: 1440px) {
  .hero, .demo {
    max-width: 1400px;
    margin: auto;
  }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="nav">
  <div class="logo">Dream Ladders</div>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
  <div class="menu" id="menu">
    <a href="#">Home</a>
    <a href="#demo">Demo</a>
    <a href="#pricing">Pricing</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">

  <div class="hero-left">
    <h1 class="brand">DREAM LADDERS</h1>

    <p class="tagline">
      <span class="highlight">AI-Powered Civil Engineering</span><br>
      Build smarter. Estimate faster.
    </p>

    <div class="buttons">
      <button class="btn primary"
        onclick="window.open('https://rajeshshambudu.github.io/dream-ladders-ai/', '_blank')">
        Start Estimation
      </button>

      <button class="btn secondary" onclick="location.href='#demo'">
        View Demo
      </button>
    </div>
  </div>

  <div class="hero-right">
    <img class="hero-img" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
  </div>

</section>

<!-- DEMO -->
<section id="demo" class="demo">

  <h2>Real Project. Real Accuracy.</h2>
  <p style="color:#94a3b8;">AI vs Manual Engineering Comparison</p>

  <div class="card">
    <h3>1800 Sqft Ground Floor</h3>

    <table>
      <tr>
        <th>Item</th>
        <th>AI</th>
        <th>Manual</th>
      </tr>

      <tr>
        <td>Steel</td>
        <td>7447 kg</td>
        <td>7450 kg</td>
      </tr>

      <tr>
        <td>Cement</td>
        <td>820</td>
        <td>835</td>
      </tr>

      <tr>
        <td>Cost</td>
        <td>₹27.5L</td>
        <td>₹28L</td>
      </tr>
    </table>
  </div>

  <div class="cta">
    <h3 style="color:#22c55e;">~98% Accuracy</h3>

    <div class="buttons">
      <button class="btn primary"
        onclick="window.open('https://rajeshshambudu.github.io/dream-ladders-ai/', '_blank')">
        Try Your Project
      </button>

      <a href="https://wa.me/917093218658">
        <button class="btn" style="background:#22c55e;">Talk to Engineer</button>
      </a>
    </div>
  </div>

</section>

<script>
function toggleMenu() {
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}
</script>

</body>
</html>
